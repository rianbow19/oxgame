<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>殘影井字棋</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root{
    --bg: #15161c;
    --panel: #1c1e26;
    --grid-line: #2c2f3a;
    --ink: #ede8de;
    --ink-dim: #8b8d99;
    --x-color: #ede8de;
    --o-color: #6fa8a0;
    --accent: #e3b341;
    --win: #6fa8a0;
    --lock: #565a66;
    --danger: #c97b6b;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(circle at 50% -10%, #1e202a 0%, #101116 65%);
    color: var(--ink);
    font-family: 'Iowan Old Style','Georgia','Noto Serif TC', serif;
    display:flex; align-items:center; justify-content:center;
    padding: 32px 16px;
  }
  .stage{
    width: 100%;
    max-width: 440px;
    text-align:center;
  }
  h1{
    font-size: clamp(28px, 6vw, 36px);
    font-weight: 500;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }
  .subtitle{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13.5px;
    color: var(--ink-dim);
    line-height: 1.6;
    margin: 0 0 22px;
  }
  .subtitle b{ color: var(--accent); font-weight: 600; }

  /* ---------- Lobby ---------- */
  .mode-card{
    display:flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    margin-bottom: 10px;
  }
  .mode-btn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--panel);
    border: 1px solid var(--grid-line);
    border-radius: 10px;
    padding: 18px 20px;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .mode-btn:hover{ border-color: var(--o-color); }
  .mode-btn:active{ transform: scale(0.99); }
  .mode-btn .mode-title{
    font-family: 'Iowan Old Style','Georgia','Noto Serif TC', serif;
    font-size: 19px;
    margin-bottom: 4px;
  }
  .mode-btn .mode-desc{
    font-size: 12.5px;
    color: var(--ink-dim);
    line-height: 1.5;
  }

  .back-row{
    text-align: left;
    margin-bottom: 10px;
  }
  .back-btn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 13px;
    cursor: pointer;
    padding: 4px 0;
  }
  .back-btn:hover{ color: var(--ink); }

  /* ---------- Online setup ---------- */
  .online-tabs{
    display:flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .online-tab{
    flex: 1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--panel);
    border: 1px solid var(--grid-line);
    border-radius: 6px;
    padding: 10px;
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 13.5px;
  }
  .online-tab.active{
    border-color: var(--o-color);
    color: var(--ink);
    background: #262a35;
  }
  .online-pane{ display:none; }
  .online-pane.active{ display:block; }

  .room-code-display{
    font-size: 36px;
    letter-spacing: 0.15em;
    font-weight: 600;
    margin: 14px 0 6px;
    color: var(--accent);
  }
  .code-input{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--grid-line);
    border-radius: 6px;
    padding: 12px;
    font-size: 20px;
    letter-spacing: 0.2em;
    text-align: center;
    color: var(--ink);
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .code-input:focus{ outline: 2px solid var(--accent); border-color: var(--accent); }

  .primary-btn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--o-color);
    color: #12151a;
    border: none;
    border-radius: 6px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .primary-btn:hover{ filter: brightness(1.08); }
  .primary-btn:disabled{ opacity: 0.5; cursor: not-allowed; }

  .online-status-line{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: var(--ink-dim);
    margin: 10px 0 18px;
    min-height: 18px;
  }

  /* ---------- Shared level/progress UI (AI screen) ---------- */
  .progress-track{ display:flex; align-items:center; justify-content:center; gap: 6px; margin-bottom: 10px; }
  .progress-track .step{ width: 20px; height: 4px; border-radius: 2px; background: var(--grid-line); }
  .progress-track .step.cleared{ background: var(--o-color); }
  .progress-track .step.current{ background: var(--accent); }

  .level-row{ display:flex; gap: 7px; justify-content: center; margin-bottom: 14px; }
  .level-btn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--panel);
    border: 1px solid var(--grid-line);
    border-radius: 50%;
    width: 44px; height: 44px;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-dim);
    font-size: 15px;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .level-btn:hover:not(.locked):not(.active){ border-color: #454955; color: var(--ink); }
  .level-btn:active:not(.locked){ transform: scale(0.94); }
  .level-btn.active{ background: #262a35; border-color: var(--o-color); color: var(--ink); }
  .level-btn.cleared::after{ content: '★'; position:absolute; top:-6px; right:-4px; font-size: 11px; color: var(--accent); }
  .level-btn.locked{ color: var(--lock); cursor: not-allowed; opacity: 0.55; }

  .level-info{ margin-bottom: 16px; }
  .level-name{ font-size: 17px; font-weight: 600; margin-bottom: 2px; }
  .level-desc{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12.5px; color: var(--ink-dim); min-height: 32px; line-height: 1.5; margin: 0;
  }

  /* ---------- Versus row (AI screen): player left, boss right ---------- */
  .versus{
    display:grid; grid-template-columns: 1fr auto 1fr; align-items:center;
    gap: 10px; margin-bottom: 14px;
  }
  .fighter{
    display:flex; flex-direction: column; align-items:center; gap: 6px;
    opacity: 0.55; transition: opacity 0.2s ease;
  }
  .fighter.turn, .fighter.winner{ opacity: 1; }
  .portrait{
    width: clamp(76px, 24vw, 104px); aspect-ratio: 1 / 1;
    border-radius: 14px; overflow: hidden;
    background: radial-gradient(circle at 50% 35%, #262a35 0%, var(--panel) 70%);
    border: 1px solid var(--grid-line);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .portrait svg{ display:block; width:100%; height:100%; }
  .fighter.turn .portrait{ border-color: var(--accent); box-shadow: 0 0 0 3px rgba(227,179,65,0.15); }
  .fighter.winner .portrait{ border-color: var(--win); box-shadow: 0 0 0 3px rgba(111,168,160,0.22); }
  .fighter.defeated .portrait svg{ filter: grayscale(1); opacity: 0.45; }
  .fighter-name{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12.5px; color: var(--ink-dim);
  }
  .fighter-name b{ font-weight: 600; }
  .fighter[data-mark="X"] .fighter-name b{ color: var(--x-color); }
  .fighter[data-mark="O"] .fighter-name b{ color: var(--o-color); }
  .vs{ font-size: 18px; font-style: italic; color: var(--accent); letter-spacing: 0.05em; }
  .boss .float{ animation: float 3.2s ease-in-out infinite; }
  @keyframes float{ 50%{ transform: translateY(-3px); } }

  .status{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px; min-height: 22px; margin-bottom: 18px;
  }

  /* ---------- Board (shared look, used by both screens) ---------- */
  .board{
    display:grid;
    /* minmax(0, …) keeps every track equal; plain 1fr grows with its content */
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: 3px;
    background: var(--grid-line);
    border-radius: 6px;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
  }
  .cell{
    background: var(--panel);
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(32px, 10vw, 48px);
    line-height: 1;
    cursor: pointer;
    position: relative;
    user-select: none;
    transition: background 0.15s ease;
  }
  .cell:hover:not(.filled):not(.disabled){ background: #23252f; }
  .cell.disabled, .cell.filled{ cursor: default; }
  .cell .mark{ display:inline-block; opacity: 0; transform: scale(0.6); animation: pop 0.22s ease forwards; }
  @keyframes pop{ to{ opacity: 1; transform: scale(1); } }
  .cell .mark.x{ color: var(--x-color); }
  .cell .mark.o{ color: var(--o-color); }
  .cell.win-cell{ background: rgba(111,168,160,0.16); }
  .cell.win-cell .mark{ color: var(--win); }

  .controls{ margin-top: 24px; display:flex; flex-direction: column; align-items: center; gap: 10px; }
  button.restart{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--grid-line);
    padding: 10px 22px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  button.restart:hover{ border-color: var(--ink-dim); }
  button.restart.rematch{ border-color: var(--o-color); }
  .link-btn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: none; border: none; color: var(--ink-dim);
    font-size: 12px; text-decoration: underline; cursor: pointer; padding: 2px;
  }
  .link-btn:hover{ color: var(--ink); }

  button.restart:focus-visible, .cell:focus-visible, .level-btn:focus-visible,
  .mode-btn:focus-visible, .online-tab:focus-visible, .primary-btn:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .mark, .boss .float{ animation: none !important; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<div class="stage">

  <!-- ========== LOBBY ========== -->
  <div id="lobbyScreen">
    <h1>殘影井字棋</h1>
    <p class="subtitle">你和對手各自最多同時留 <b>三顆棋子</b>。輪到你下第四手時，你最早的那顆會消失；對手也一樣，彼此互不影響。</p>
    <div class="mode-card">
      <button class="mode-btn" id="toAiBtn" type="button">
        <div class="mode-title">🤖 電腦對戰</div>
        <div class="mode-desc">五關挑戰晉級，從新手幽靈打到太古棋魂</div>
      </button>
      <button class="mode-btn" id="toOnlineBtn" type="button">
        <div class="mode-title">🌐 玩家對戰</div>
        <div class="mode-desc">建立房間或輸入房號，跟朋友跨裝置連線對戰</div>
      </button>
    </div>
  </div>

  <!-- ========== AI SCREEN ========== -->
  <div id="aiScreen" class="hidden">
    <div class="back-row"><button class="back-btn" id="aiBackBtn" type="button">← 返回大廳</button></div>

    <div class="progress-track" id="progressTrack"></div>
    <div class="level-row" id="levelRow"></div>

    <div class="level-info">
      <div class="level-name" id="levelName"></div>
      <p class="level-desc" id="levelDesc"></p>
    </div>

    <div class="versus">
      <div class="fighter" id="playerFighter" data-mark="X">
        <div class="portrait" id="playerPortrait"></div>
        <div class="fighter-name"><b>你</b>　X</div>
      </div>
      <div class="vs">VS</div>
      <div class="fighter boss" id="bossFighter" data-mark="O">
        <div class="portrait" id="bossPortrait"></div>
        <div class="fighter-name"><b id="bossName"></b>　O</div>
      </div>
    </div>

    <div class="status" id="status" aria-live="polite"></div>

    <div class="board" id="board" role="grid" aria-label="井字棋盤"></div>

    <div class="controls">
      <button class="restart rematch hidden" id="nextLevel" type="button">前往下一關 →</button>
      <button class="restart" id="restart">重新開始這一關</button>
      <button class="link-btn" id="resetProgress" type="button">重設全部進度</button>
    </div>
  </div>

  <!-- ========== ONLINE SETUP SCREEN ========== -->
  <div id="onlineSetupScreen" class="hidden">
    <div class="back-row"><button class="back-btn" id="onlineSetupBackBtn" type="button">← 返回大廳</button></div>
    <h1 style="font-size:24px;">玩家對戰</h1>

    <div class="online-tabs">
      <button class="online-tab active" id="hostTabBtn" type="button">建立房間</button>
      <button class="online-tab" id="joinTabBtn" type="button">輸入房號</button>
    </div>

    <div class="online-pane active" id="hostPane">
      <p class="subtitle" style="margin-bottom:6px;">建立房間後，把房號傳給朋友，由他輸入加入。連線後隨機決定先後手。</p>
      <button class="primary-btn" id="hostCreateBtn" type="button">建立房間</button>
      <div class="room-code-display hidden" id="roomCodeDisplay"></div>
      <div class="online-status-line" id="hostStatusLine"></div>
      <button class="link-btn hidden" id="copyCodeBtn" type="button">複製房號</button>
    </div>

    <div class="online-pane" id="joinPane">
      <p class="subtitle" style="margin-bottom:6px;">輸入朋友給你的房號加入對戰。連線後隨機決定先後手。</p>
      <input class="code-input" id="joinCodeInput" maxlength="4" placeholder="房號" autocomplete="off">
      <button class="primary-btn" id="joinConnectBtn" type="button">加入房間</button>
      <div class="online-status-line" id="joinStatusLine"></div>
    </div>
  </div>

  <!-- ========== ONLINE GAME SCREEN ========== -->
  <div id="onlineGameScreen" class="hidden">
    <div class="back-row"><button class="back-btn" id="onlineGameBackBtn" type="button">← 離開這場對戰</button></div>
    <h1 style="font-size:24px;">玩家對戰</h1>
    <div class="versus">
      <div class="fighter" id="meFighter">
        <div class="portrait" id="mePortrait"></div>
        <div class="fighter-name"><b>你</b>　<span id="meMark"></span></div>
      </div>
      <div class="vs">VS</div>
      <div class="fighter" id="foeFighter">
        <div class="portrait" id="foePortrait"></div>
        <div class="fighter-name"><b>對手</b>　<span id="foeMark"></span></div>
      </div>
    </div>

    <div class="status" id="onlineStatus" aria-live="polite"></div>

    <div class="board" id="onlineBoard" role="grid" aria-label="井字棋盤"></div>

    <div class="controls">
      <button class="restart rematch hidden" id="rematchBtn" type="button">再來一局</button>
    </div>
  </div>

</div>

<script>
(function(){
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function wins(b, player){
    return LINES.some(line => line.every(i => b[i] === player));
  }

  // Pure simulation shared by both modes: each player keeps an independent
  // queue of up to 3 marks. Placing a 4th mark removes that player's own
  // oldest mark only — the opponent's marks are untouched.
  function place(b, qs, idx, player){
    const nb = b.slice();
    const nq = { X: qs.X.map(o => ({...o})), O: qs.O.map(o => ({...o})) };
    const myQueue = nq[player];
    if(myQueue.length >= 3){
      const removed = myQueue.shift();
      nb[removed.index] = null;
    }
    nb[idx] = player;
    myQueue.push({ index: idx });
    return { board: nb, queues: nq };
  }

  function emptyCells(b){
    const out = [];
    for(let i=0;i<9;i++) if(!b[i]) out.push(i);
    return out;
  }

  function findWinLine(b, player){
    return LINES.find(line => line.every(i => b[i] === player));
  }

  function buildCellsInto(containerEl, onClick){
    containerEl.innerHTML = '';
    for(let i=0;i<9;i++){
      const c = document.createElement('div');
      c.className = 'cell';
      c.dataset.index = i;
      c.setAttribute('role','gridcell');
      c.tabIndex = 0;
      c.addEventListener('click', () => onClick(i));
      c.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onClick(i); }
      });
      containerEl.appendChild(c);
    }
  }

  function renderBoardInto(containerEl, board, disabledAll, winLine){
    for(let i=0;i<9;i++){
      const cell = containerEl.children[i];
      cell.classList.toggle('filled', !!board[i]);
      cell.classList.toggle('disabled', disabledAll || !!board[i]);
      cell.classList.toggle('win-cell', !!(winLine && winLine.includes(i)));
      const existing = cell.querySelector('.mark');
      if(board[i]){
        if(!existing || existing.dataset.val !== board[i]){
          cell.innerHTML = '';
          const span = document.createElement('span');
          span.className = 'mark ' + (board[i] === 'X' ? 'x' : 'o');
          span.dataset.val = board[i];
          span.textContent = board[i];
          cell.appendChild(span);
        }
      } else {
        cell.innerHTML = '';
      }
    }
  }

  // ================= PORTRAITS =================
  // Player avatars; each match picks one at random.
  const PLAYER_ART = [
    { name: '斗篷旅人', art: `
      <path d="M18 100 C18 62 27 20 50 20 C73 20 82 62 82 100 Z" fill="#454b60"/>
      <ellipse cx="50" cy="56" rx="19" ry="20" fill="#ede8de"/>
      <path d="M31 52 C33 36 42 30 50 30 C58 30 67 36 69 52 C62 44 56 41 50 41 C44 41 38 44 31 52 Z" fill="#454b60"/>
      <circle cx="43" cy="56" r="2.6" fill="#15161c"/>
      <circle cx="57" cy="56" r="2.6" fill="#15161c"/>
      <path d="M44.5 64 q5.5 4.5 11 0" stroke="#15161c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M26 84 q24 11 48 0 v16 h-48 z" fill="#e3b341"/>` },
    { name: '小狐狸', art: `
      <path d="M24 100 Q50 82 76 100 Z" fill="#6fa8a0"/>
      <path d="M22 20 L42 40 L25 52 Z M78 20 L58 40 L75 52 Z" fill="#e08a4a"/>
      <path d="M27 29 L37 40 L29 46 Z M73 29 L63 40 L71 46 Z" fill="#3a2a22"/>
      <ellipse cx="50" cy="58" rx="28" ry="24" fill="#e08a4a"/>
      <path d="M22 60 Q36 58 50 70 Q64 58 78 60 Q72 82 50 84 Q28 82 22 60 Z" fill="#f4ede0"/>
      <path d="M35 54 q5 -4 10 0 M55 54 q5 -4 10 0" stroke="#2a1d16" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="50" cy="70" rx="3.6" ry="2.6" fill="#2a1d16"/>` },
    { name: '灰貓', art: `
      <path d="M22 100 Q50 84 78 100 Z" fill="#5b5f6b"/>
      <path d="M24 22 L43 40 L23 50 Z M76 22 L57 40 L77 50 Z" fill="#8b8f9c"/>
      <path d="M28 31 L37 40 L28 45 Z M72 31 L63 40 L72 45 Z" fill="#e8a7b0"/>
      <ellipse cx="50" cy="59" rx="28" ry="24" fill="#8b8f9c"/>
      <ellipse cx="40" cy="56" rx="4.6" ry="5.6" fill="#b7e07a"/><ellipse cx="40" cy="56" rx="1.5" ry="4.4" fill="#15161c"/>
      <ellipse cx="60" cy="56" rx="4.6" ry="5.6" fill="#b7e07a"/><ellipse cx="60" cy="56" rx="1.5" ry="4.4" fill="#15161c"/>
      <path d="M47 64 h6 l-3 3.4 z" fill="#e8a7b0"/>
      <path d="M50 67 q-3 4 -6.5 2 M50 67 q3 4 6.5 2" stroke="#15161c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M30 64 l-10 -2 M30 68 l-10 2 M70 64 l10 -2 M70 68 l10 2" stroke="#d6d8de" stroke-width="1.3" stroke-linecap="round"/>` },
    { name: '小魔法師', art: `
      <path d="M20 100 Q50 76 80 100 Z" fill="#4b5fa8"/>
      <circle cx="50" cy="62" r="17" fill="#f1d9c0"/>
      <path d="M33 64 Q50 102 67 64 Q58 74 50 74 Q42 74 33 64 Z" fill="#ede8de"/>
      <circle cx="44" cy="60" r="2.4" fill="#15161c"/>
      <circle cx="56" cy="60" r="2.4" fill="#15161c"/>
      <path d="M26 48 L52 4 L74 48 Z" fill="#4b5fa8"/>
      <ellipse cx="50" cy="48" rx="32" ry="6" fill="#3c4d8c"/>
      <path d="M52 20 l2 4.5 l4.5 0.6 l-3.3 3 l0.9 4.6 l-4.1 -2.3 l-4.1 2.3 l0.9 -4.6 l-3.3 -3 l4.5 -0.6 z" fill="#e3b341"/>
      <circle cx="40" cy="36" r="1.6" fill="#e3b341"/><circle cx="62" cy="38" r="1.3" fill="#e3b341"/>` },
    { name: '白兔', art: `
      <path d="M24 100 Q50 84 76 100 Z" fill="#c97b6b"/>

      <ellipse cx="62" cy="26" rx="7.5" ry="21" transform="rotate(8 62 26)" fill="#ede8de"/>

    // ---------- Exact solution of the game ----------
    // A position is fully described by each side's queue of marks (oldest
    // first) plus whose turn it is. Every position reachable from the empty
    // board (~116k) is solved by retrograde analysis, so each one is known to
    // be a win or loss for the side to move (with how many plies it takes) or
    // an endless cycle.
    let solved = null;

    function encodeQueue(q){
      return (q[0] ?? 9) * 100 + (q[1] ?? 9) * 10 + (q[2] ?? 9);
    }
    function encodeState(X, O, turn){
      return (turn === 'X' ? 0 : 1000000) + encodeQueue(X) * 1000 + encodeQueue(O);
    }
    function pushMark(q, cell){
      return (q.length >= 3 ? q.slice(1) : q.slice()).concat(cell);
    }
    function queueWins(q){
      return q.length === 3 && LINES.some(line => line.every(i => q.includes(i)));
    }

    function solveGame(){
      const idOf = new Map();
      const kids = [];      // kids[s] = child state ids (non-winning moves)
      const hasWin = [];    // side to move can complete a line right now
      const todo = [];

      function getId(X, O, turn){
        const code = encodeState(X, O, turn);
        let id = idOf.get(code);
        if(id === undefined){
          id = kids.length;
          idOf.set(code, id);
          kids.push(null);
          hasWin.push(false);
          todo.push([id, X, O, turn]);
        }
        return id;
      }

      getId([], [], 'X');
      while(todo.length){
        const [id, X, O, turn] = todo.pop();
        const occupied = new Set([...X, ...O]);
        const list = [];
        for(let c = 0; c < 9; c++){
          if(occupied.has(c)) continue;
          const mine = pushMark(turn === 'X' ? X : O, c);
          if(queueWins(mine)){ hasWin[id] = true; continue; }
          list.push(turn === 'X' ? getId(mine, O, 'O') : getId(X, mine, 'X'));
        }
        kids[id] = list;
      }

      const n = kids.length;
      const val = new Int8Array(n);     // 1 = side to move wins, -1 = loses, 0 = endless
      const dist = new Uint8Array(n);   // plies until the game ends
      const parents = Array.from({ length: n }, () => []);
      const remaining = new Int32Array(n);
      for(let s = 0; s < n; s++){
        for(const k of kids[s]) parents[k].push(s);
        remaining[s] = kids[s].length;
      }

      // Breadth-first from the end of the game: wins get their shortest
      // distance, losses their longest.
      let queue = [];
      for(let s = 0; s < n; s++){
        if(hasWin[s]){ val[s] = 1; dist[s] = 1; queue.push(s); }
      }
      while(queue.length){
        const next = [];
        for(const s of queue){
          for(const p of parents[s]){
            if(val[p] !== 0) continue;
            if(val[s] === -1){
              val[p] = 1; dist[p] = dist[s] + 1; next.push(p);
            } else if(--remaining[p] === 0){
              val[p] = -1; dist[p] = dist[s] + 1; next.push(p);
            }
          }
        }
        queue = next;
      }

      return function lookup(X, O, turn){
        const id = idOf.get(encodeState(X, O, turn));
        return { val: val[id], dist: dist[id] };
      };
    }

    // ---------- Level AI ----------
    // horizon: how many plies ahead the ghost can see. Outcomes further away
    //          than that look like an ordinary, undecided move to it.
    // lapse:   chance per move that its sight drops to 2 plies (it still
    //          takes a win and blocks, but misses anything deeper).
    // cunning: when lost, pick the move that leaves the player the fewest
    //          winning replies; when undecided, the one with the most traps.
    // wander:  chance per move that it just drifts to a random cell.
    // naive:   it does not understand that marks vanish, so it misreads wins
    //          and threats that involve an oldest mark; it only notices its
    //          own win with winChance and the player's with blockChance.
    const LEVEL_PARAMS = [
      { naive: true, winChance: 1, blockChance: 1 },
      { horizon: 3, lapse: 0.15 },
      { horizon: 5, lapse: 0.25 },
      { horizon: 9, lapse: 0.15 },
      { horizon: Infinity, cunning: true }
    ];

    function getAIMove(b, qs){
      if(!solved) solved = solveGame();
      const params = LEVEL_PARAMS[currentLevelIndex];
      const empties = emptyCells(b);
      if(Math.random() < (params.wander || 0)) return randomOf(empties);
      if(params.naive) return naiveMove(b, empties, params);
      return searchMove(qs.X.map(o => o.index), qs.O.map(o => o.index), empties, params);
    }

    function randomOf(list){
      return list[Math.floor(Math.random() * list.length)];
    }

    // Sees the board as if marks never vanished.
    function naiveMove(b, empties, params){
      const completes = (c, player) => {
        const b2 = b.slice();
        b2[c] = player;
        return wins(b2, player);
      };
      if(Math.random() < params.winChance){
        const win = empties.find(c => completes(c, 'O'));
        if(win !== undefined) return win;
      }
      if(Math.random() < params.blockChance){
        const block = empties.find(c => completes(c, 'X'));
        if(block !== undefined) return block;
      }
      return randomOf(empties);
    }

    // Outcome of O playing `cell`, seen from O: plies until the game ends,
    // and whether O wins (1), loses (-1) or it never ends (0).
    function outcomeOf(X, O, cell){
      const nO = pushMark(O, cell);
      if(queueWins(nO)) return { val: 1, dist: 1, nO };
      const r = solved(X, nO, 'X');
      return { val: -r.val, dist: r.dist + 1, nO };
    }

    function searchMove(X, O, empties, params){
      const horizon = Math.random() < (params.lapse || 0) ? Math.min(2, params.horizon) : params.horizon;
      const scored = empties.map(c => {
        const o = outcomeOf(X, O, c);
        let score = 0;
        if(o.val !== 0 && o.dist <= horizon){
          // Win as fast as possible, lose as slowly as possible.
          score = o.val === 1 ? 1000 - o.dist : -1000 + o.dist;
        }
        if(params.cunning && o.val !== 1) score += trickiness(X, o.nO, o.val) / 100;
        return { c, score };
      });
      const best = Math.max(...scored.map(s => s.score));
      return randomOf(scored.filter(s => s.score === best).map(s => s.c));
    }

    // Among the player's replies: for a lost position, fewer winning replies
    // is better; for an endless one, more replies that lose is better.
    function trickiness(X, O, val){
      const occupied = new Set([...X, ...O]);
      let good = 0, bad = 0;
      for(let c = 0; c < 9; c++){
        if(occupied.has(c)) continue;
        const nX = pushMark(X, c);
        if(queueWins(nX)){ bad++; continue; }
        const r = solved(nX, O, 'O');
        if(r.val === 1) good++;
        else if(r.val === -1) bad++;
      }
      return val === -1 ? -bad : good;
    }

    nextLevelBtn.addEventListener('click', () => {

    });
    resetProgressBtn.addEventListener('click', () => {
      currentLevelIndex = 0;
      unlockedCount = 1;
      clearedSet = new Set();
      init();
    });

    return { enter };
  })();

      joinTabBtn.classList.toggle('active', which === 'join');
      hostPane.classList.toggle('active', which === 'host');
      joinPane.classList.toggle('active', which === 'join');
    }

    hostCreateBtn.addEventListener('click', hostRoom);
    joinConnectBtn.addEventListener('click', () => joinRoom(joinCodeInput.value));
    joinCodeInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') joinRoom(joinCodeInput.value); });
    copyCodeBtn.addEventListener('click', () => {
      if(!roomCode) return;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(roomCode).then(() => {
          copyCodeBtn.textContent = '已複製！';
          setTimeout(() => { copyCodeBtn.textContent = '複製房號'; }, 1500);
        }).catch(() => {});
      }
    });
    rematchBtn.addEventListener('click', requestRematch);

    function hostRoom(){
      cleanup();
      hostCreateBtn.disabled = true;
      hostStatusLine.textContent = '建立房間中…';
      const code = genCode();
      peer = new Peer(ID_PREFIX + code);

      peer.on('open', () => {
        roomCode = code;
        roomCodeDisplay.textContent = code;
        roomCodeDisplay.classList.remove('hidden');
        copyCodeBtn.classList.remove('hidden');
        hostStatusLine.textContent = '等待對手加入…';
      });

      peer.on('connection', (c) => {
        conn = c;
        setupConnHandlers();
        conn.on('open', () => {
          isHost = true;
          enterMatch();
          hostStartRound();
        });
      });

      peer.on('error', (err) => {
        hostCreateBtn.disabled = false;
        hostStatusLine.textContent = friendlyError(err);
      });
    }

    function joinRoom(codeRaw){
      const code = (codeRaw || '').trim().toUpperCase();
      if(code.length !== 4){
        joinStatusLine.textContent = '請輸入 4 碼房號';
        return;
      }
      cleanup();
      joinConnectBtn.disabled = true;
      joinStatusLine.textContent = '連線中…';
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(ID_PREFIX + code, { reliable: true });
        setupConnHandlers();
        conn.on('open', () => {
          isHost = false;
          enterMatch();
        });
      });

      peer.on('error', (err) => {
        joinConnectBtn.disabled = false;
        joinStatusLine.textContent = friendlyError(err);
      });
    }

    function friendlyError(err){
      if(err && err.type === 'peer-unavailable') return '找不到這個房間，請確認房號是否正確';
      if(err && err.type === 'network') return '網路連線異常，請檢查網路後再試';
      return '連線發生錯誤，請重試';
    }

    function setupConnHandlers(){
      conn.on('data', (data) => {
        if(!data) return;
        if(data.type === 'move') receiveMove(data.index);
        else if(data.type === 'start'){
          avatars = data.avatars;
          playIntro(data.hostMark === 'X' ? 'O' : 'X');
        }
        else if(data.type === 'rematch' && isHost && gameOver && !inIntro) hostStartRound();
      });
      conn.on('close', onOpponentLeft);
      conn.on('error', onOpponentLeft);
    }

    function onOpponentLeft(){
      if(!connected) return;
      connected = false;
      clearTimeout(introTimer);
      inIntro = false;
      setOnlineStatus('對手已離線');
      rematchBtn.classList.add('hidden');
      renderOnlineBoard();
    }

    function enterMatch(){
      connected = true;
      if(!built){ buildCellsInto(onlineBoardEl, handleCellClick); built = true; }
      hostCreateBtn.disabled = false;
      joinConnectBtn.disabled = false;
      showScreen('onlineGame');
      if(!inIntro){
        // The guest waits here for the host's first 'start' message.
        resetBoard();
        renderOnlineBoard();
        setOnlineStatus('決定先後手…');
      }
    }

    function resetBoard(){
      board = Array(9).fill(null);
      queues = { X: [], O: [] };
      gameOver = true;   // no input until the round actually starts
      turn = 'X';
      rematchBtn.classList.add('hidden');
    }

    function hostStartRound(){
      if(avatars.host === null){
        const h = randomAvatar();
        avatars = { host: h, guest: randomAvatar(h) };
      }
      const hostMark = Math.random() < 0.5 ? 'X' : 'O';
      conn.send({ type: 'start', avatars, hostMark });
      playIntro(hostMark);
    }

    function showMarks(visible){
      const foeMark = myMark === 'X' ? 'O' : 'X';
      meFighterEl.dataset.mark = visible ? myMark : '';
      foeFighterEl.dataset.mark = visible ? foeMark : '';
      document.getElementById('meMark').textContent = visible ? myMark : '?';
      document.getElementById('foeMark').textContent = visible ? foeMark : '?';
    }

    // Bounces the highlight between the two portraits, slowing down, lands
    // on whoever moves first, and starts the round 3 seconds in.
    function playIntro(mark){
      clearTimeout(introTimer);
      inIntro = true;
      myMark = mark;
      resetBoard();
      if(!built){ buildCellsInto(onlineBoardEl, handleCellClick); built = true; }
      showMarks(false);
      renderOnlineBoard();
      setOnlineStatus('決定先後手…');

      const delays = [];
      for(let d = 60, t = 0; t + d <= 2600; t += d, d *= 1.15) delays.push(d);
      const firstSide = myMark === 'X' ? 'left' : 'right';
      const otherSide = firstSide === 'left' ? 'right' : 'left';
      let side = delays.length % 2 === 0 ? firstSide : otherSide;
      let i = 0, elapsed = 0;
      const step = () => {
        updateVersus(meFighterEl, foeFighterEl, side, null);
        if(i < delays.length){
          introTimer = setTimeout(() => {
            elapsed += delays[i++];
            side = side === 'left' ? 'right' : 'left';
            step();
          }, delays[i]);
          return;
        }
        showMarks(true);
        setOnlineStatus(myMark === 'X' ? '你先手！' : '對手先手');
        introTimer = setTimeout(beginRound, 3000 - elapsed);
      };
      step();
    }

    function beginRound(){
      inIntro = false;
      gameOver = false;
      renderOnlineBoard();
      setOnlineStatus(isMyTurn() ? '輪到你了' : '等待對手下子…');
    }

    function isMyTurn(){ return connected && !gameOver && turn === myMark; }

    function setOnlineStatus(text){ onlineStatusEl.textContent = text; }

    function renderOnlineBoard(winLine){
      renderBoardInto(onlineBoardEl, board, !isMyTurn(), winLine);
      renderVersus(winLine ? board[winLine[0]] : null);
    }

    function renderVersus(winnerMark){
      mePortraitEl.innerHTML = avatarSvg(isHost ? avatars.host : avatars.guest);
      foePortraitEl.innerHTML = avatarSvg(isHost ? avatars.guest : avatars.host);
      const turnSide = connected && !gameOver ? (turn === myMark ? 'left' : 'right') : null;
      const winnerSide = winnerMark ? (winnerMark === myMark ? 'left' : 'right') : null;
      updateVersus(meFighterEl, foeFighterEl, turnSide, winnerSide);
    }

    function doMove(idx, player){
      const result = place(board, queues, idx, player);
      board = result.board;
      queues = result.queues;

      if(wins(board, player)){
        gameOver = true;
        renderOnlineBoard(findWinLine(board, player));
        const youWon = player === myMark;
        setOnlineStatus(youWon ? '你贏了！🎉' : '你輸了，再試一次？');
        rematchBtn.classList.remove('hidden');
        return true;
      }
      renderOnlineBoard();
      return false;
    }

    function handleCellClick(idx){
      if(!isMyTurn() || board[idx]) return;
      const finished = doMove(idx, myMark);
      if(conn && conn.open) conn.send({ type: 'move', index: idx });
      if(!finished){
        turn = (myMark === 'X') ? 'O' : 'X';
        setOnlineStatus('等待對手下子…');
        renderOnlineBoard();
      }
    }

    function receiveMove(idx){
      if(gameOver) return;
      const opponentMark = myMark === 'X' ? 'O' : 'X';
      const finished = doMove(idx, opponentMark);
      if(!finished){
        turn = myMark;
        setOnlineStatus('輪到你了');
        renderOnlineBoard();
      }
    }

    // Only the host decides a new round; the guest asks for one.
    function requestRematch(){
      if(!gameOver || inIntro || !connected) return;
      if(isHost){
        hostStartRound();
      } else {
        rematchBtn.classList.add('hidden');
        setOnlineStatus('準備新的一局…');
        if(conn && conn.open) conn.send({ type: 'rematch' });
      }
    }

    function cleanup(){
      if(conn){ try{ conn.close(); }catch(e){} conn = null; }
      if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
      connected = false;
      clearTimeout(introTimer);
      inIntro = false;
      avatars = { host: null, guest: null };
      roomCode = '';
      roomCodeDisplay.classList.add('hidden');
      roomCodeDisplay.textContent = '';
      copyCodeBtn.classList.add('hidden');
      copyCodeBtn.textContent = '複製房號';
      hostStatusLine.textContent = '';
      joinStatusLine.textContent = '';
      joinCodeInput.value = '';
      hostCreateBtn.disabled = false;
      joinConnectBtn.disabled = false;
      switchTab('host');
    }

    return { cleanup };
  })();

})();
</script>
