<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>殘影井字棋</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root{
    --bg: #15161c;
    --panel: #1c1e26;
    --grid-line: #2c2f3a;
    --ink: #ede8de;
    --ink-dim: #8b8d99;
    --x-color: #ede8de;
    --o-color: #6fa8a0;
    --accent: #e3b341;
    --win: #6fa8a0;
    --lock: #565a66;
    --danger: #c97b6b;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(circle at 50% -10%, #1e202a 0%, #101116 65%);
    color: var(--ink);
    font-family: 'Iowan Old Style','Georgia','Noto Serif TC', serif;
    display:flex; align-items:center; justify-content:center;
    padding: 32px 16px;
  }
  .stage{
    width: 100%;
    max-width: 440px;
    text-align:center;
  }
  h1{
    font-size: clamp(28px, 6vw, 36px);
    font-weight: 500;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }
  .subtitle{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13.5px;
    color: var(--ink-dim);
    line-height: 1.6;
    margin: 0 0 22px;
  }
  .subtitle b{ color: var(--accent); font-weight: 600; }

  /* ---------- Lobby ---------- */
  .mode-card{
    display:flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    margin-bottom: 10px;
  }
  .mode-btn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--panel);
    border: 1px solid var(--grid-line);
    border-radius: 10px;
    padding: 18px 20px;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .mode-btn:hover{ border-color: var(--o-color); }
  .mode-btn:active{ transform: scale(0.99); }
  .mode-btn .mode-title{
    font-family: 'Iowan Old Style','Georgia','Noto Serif TC', serif;
    font-size: 19px;
    margin-bottom: 4px;
  }
  .mode-btn .mode-desc{
    font-size: 12.5px;
    color: var(--ink-dim);
    line-height: 1.5;
  }

  .back-row{
    text-align: left;
    margin-bottom: 10px;
  }
  .back-btn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 13px;
    cursor: pointer;
    padding: 4px 0;
  }
  .back-btn:hover{ color: var(--ink); }

  /* ---------- Online setup ---------- */
  .online-tabs{
    display:flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .online-tab{
    flex: 1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--panel);
    border: 1px solid var(--grid-line);
    border-radius: 6px;
    padding: 10px;
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 13.5px;
  }
  .online-tab.active{
    border-color: var(--o-color);
    color: var(--ink);
    background: #262a35;
  }
  .online-pane{ display:none; }
  .online-pane.active{ display:block; }

  .room-code-display{
    font-size: 36px;
    letter-spacing: 0.15em;
    font-weight: 600;
    margin: 14px 0 6px;
    color: var(--accent);
  }
  .code-input{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--grid-line);
    border-radius: 6px;
    padding: 12px;
    font-size: 20px;
    letter-spacing: 0.2em;
    text-align: center;
    color: var(--ink);
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .code-input:focus{ outline: 2px solid var(--accent); border-color: var(--accent); }

  .primary-btn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--o-color);
    color: #12151a;
    border: none;
    border-radius: 6px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .primary-btn:hover{ filter: brightness(1.08); }
  .primary-btn:disabled{ opacity: 0.5; cursor: not-allowed; }

  .online-status-line{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: var(--ink-dim);
    margin: 10px 0 18px;
    min-height: 18px;
  }

  .mark-badge{
    display:inline-block;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    border: 1px solid var(--grid-line);
    border-radius: 999px;
    padding: 3px 12px;
    color: var(--ink-dim);
    margin-bottom: 14px;
  }

  /* ---------- Shared level/progress UI (AI screen) ---------- */
  .progress-track{ display:flex; align-items:center; justify-content:center; gap: 6px; margin-bottom: 10px; }
  .progress-track .step{ width: 20px; height: 4px; border-radius: 2px; background: var(--grid-line); }
  .progress-track .step.cleared{ background: var(--o-color); }
  .progress-track .step.current{ background: var(--accent); }

  .level-row{ display:flex; gap: 7px; justify-content: center; margin-bottom: 14px; }
  .level-btn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--panel);
    border: 1px solid var(--grid-line);
    border-radius: 50%;
    width: 44px; height: 44px;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-dim);
    font-size: 15px;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .level-btn:hover:not(.locked):not(.active){ border-color: #454955; color: var(--ink); }
  .level-btn:active:not(.locked){ transform: scale(0.94); }
  .level-btn.active{ background: #262a35; border-color: var(--o-color); color: var(--ink); }
  .level-btn.cleared::after{ content: '★'; position:absolute; top:-6px; right:-4px; font-size: 11px; color: var(--accent); }
  .level-btn.locked{ color: var(--lock); cursor: not-allowed; opacity: 0.55; }

  .level-info{ margin-bottom: 16px; }
  .level-name{ font-size: 17px; font-weight: 600; margin-bottom: 2px; }
  .level-desc{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12.5px; color: var(--ink-dim); min-height: 32px; line-height: 1.5; margin: 0;
  }

  .status{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px; min-height: 22px; margin-bottom: 18px;
  }

  /* ---------- Board (shared look, used by both screens) ---------- */
  .board{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    background: var(--grid-line);
    border-radius: 6px;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
  }
  .cell{
    background: var(--panel);
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(32px, 10vw, 48px);
    line-height: 1;
    cursor: pointer;
    position: relative;
    user-select: none;
    transition: background 0.15s ease;
  }
  .cell:hover:not(.filled):not(.disabled){ background: #23252f; }
  .cell.disabled, .cell.filled{ cursor: default; }
  .cell .mark{ display:inline-block; opacity: 0; transform: scale(0.6); animation: pop 0.22s ease forwards; }
  @keyframes pop{ to{ opacity: 1; transform: scale(1); } }
  .cell .mark.x{ color: var(--x-color); }
  .cell .mark.o{ color: var(--o-color); }
  .cell.win-cell{ background: rgba(111,168,160,0.16); }
  .cell.win-cell .mark{ color: var(--win); }

  .controls{ margin-top: 24px; display:flex; flex-direction: column; align-items: center; gap: 10px; }
  button.restart{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--grid-line);
    padding: 10px 22px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  button.restart:hover{ border-color: var(--ink-dim); }
  button.restart.rematch{ border-color: var(--o-color); }
  .link-btn{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: none; border: none; color: var(--ink-dim);
    font-size: 12px; text-decoration: underline; cursor: pointer; padding: 2px;
  }
  .link-btn:hover{ color: var(--ink); }

  button.restart:focus-visible, .cell:focus-visible, .level-btn:focus-visible,
  .mode-btn:focus-visible, .online-tab:focus-visible, .primary-btn:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){ .mark{ animation: none !important; } }
</style>
</head>
<body>

<div class="stage">

  <!-- ========== LOBBY ========== -->
  <div id="lobbyScreen">
    <h1>殘影井字棋</h1>
    <p class="subtitle">你和對手各自最多同時留 <b>三顆棋子</b>。輪到你下第四手時，你最早的那顆會消失；對手也一樣，彼此互不影響。</p>
    <div class="mode-card">
      <button class="mode-btn" id="toAiBtn" type="button">
        <div class="mode-title">🤖 電腦對戰</div>
        <div class="mode-desc">五關挑戰晉級，從新手幽靈打到太古棋魂</div>
      </button>
      <button class="mode-btn" id="toOnlineBtn" type="button">
        <div class="mode-title">🌐 玩家對戰</div>
        <div class="mode-desc">建立房間或輸入房號，跟朋友跨裝置連線對戰</div>
      </button>
    </div>
  </div>

  <!-- ========== AI SCREEN ========== -->
  <div id="aiScreen" class="hidden">
    <div class="back-row"><button class="back-btn" id="aiBackBtn" type="button">← 返回大廳</button></div>

    <div class="progress-track" id="progressTrack"></div>
    <div class="level-row" id="levelRow"></div>

    <div class="level-info">
      <div class="level-name" id="levelName"></div>
      <p class="level-desc" id="levelDesc"></p>
    </div>

    <div class="status" id="status" aria-live="polite"></div>

    <div class="board" id="board" role="grid" aria-label="井字棋盤"></div>

    <div class="controls">
      <button class="restart" id="restart">重新開始這一關</button>
      <button class="link-btn" id="resetProgress" type="button">重設全部進度</button>
    </div>
  </div>

  <!-- ========== ONLINE SETUP SCREEN ========== -->
  <div id="onlineSetupScreen" class="hidden">
    <div class="back-row"><button class="back-btn" id="onlineSetupBackBtn" type="button">← 返回大廳</button></div>
    <h1 style="font-size:24px;">玩家對戰</h1>

    <div class="online-tabs">
      <button class="online-tab active" id="hostTabBtn" type="button">建立房間</button>
      <button class="online-tab" id="joinTabBtn" type="button">輸入房號</button>
    </div>

    <div class="online-pane active" id="hostPane">
      <p class="subtitle" style="margin-bottom:6px;">建立房間後，把房號傳給朋友，由他輸入加入。你會是先手 X。</p>
      <button class="primary-btn" id="hostCreateBtn" type="button">建立房間</button>
      <div class="room-code-display hidden" id="roomCodeDisplay"></div>
      <div class="online-status-line" id="hostStatusLine"></div>
      <button class="link-btn hidden" id="copyCodeBtn" type="button">複製房號</button>
    </div>

    <div class="online-pane" id="joinPane">
      <p class="subtitle" style="margin-bottom:6px;">輸入朋友給你的房號加入對戰。你會是後手 O。</p>
      <input class="code-input" id="joinCodeInput" maxlength="4" placeholder="房號" autocomplete="off">
      <button class="primary-btn" id="joinConnectBtn" type="button">加入房間</button>
      <div class="online-status-line" id="joinStatusLine"></div>
    </div>
  </div>

  <!-- ========== ONLINE GAME SCREEN ========== -->
  <div id="onlineGameScreen" class="hidden">
    <div class="back-row"><button class="back-btn" id="onlineGameBackBtn" type="button">← 離開這場對戰</button></div>
    <h1 style="font-size:24px;">玩家對戰</h1>
    <div class="mark-badge" id="myMarkBadge"></div>

    <div class="status" id="onlineStatus" aria-live="polite"></div>

    <div class="board" id="onlineBoard" role="grid" aria-label="井字棋盤"></div>

    <div class="controls">
      <button class="restart rematch hidden" id="rematchBtn" type="button">再來一局</button>
    </div>
  </div>

</div>

<script>
(function(){
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function wins(b, player){
    return LINES.some(line => line.every(i => b[i] === player));
  }

  // Pure simulation shared by both modes: each player keeps an independent
  // queue of up to 3 marks. Placing a 4th mark removes that player's own
  // oldest mark only — the opponent's marks are untouched.
  function place(b, qs, idx, player){
    const nb = b.slice();
    const nq = { X: qs.X.map(o => ({...o})), O: qs.O.map(o => ({...o})) };
    const myQueue = nq[player];
    if(myQueue.length >= 3){
      const removed = myQueue.shift();
      nb[removed.index] = null;
    }
    nb[idx] = player;
    myQueue.push({ index: idx });
    return { board: nb, queues: nq };
  }

  function emptyCells(b){
    const out = [];
    for(let i=0;i<9;i++) if(!b[i]) out.push(i);
    return out;
  }

  function findWinLine(b, player){
    return LINES.find(line => line.every(i => b[i] === player));
  }

  function buildCellsInto(containerEl, onClick){
    containerEl.innerHTML = '';
    for(let i=0;i<9;i++){
      const c = document.createElement('div');
      c.className = 'cell';
      c.dataset.index = i;
      c.setAttribute('role','gridcell');
      c.tabIndex = 0;
      c.addEventListener('click', () => onClick(i));
      c.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onClick(i); }
      });
      containerEl.appendChild(c);
    }
  }

  function renderBoardInto(containerEl, board, disabledAll, winLine){
    for(let i=0;i<9;i++){
      const cell = containerEl.children[i];
      cell.classList.toggle('filled', !!board[i]);
      cell.classList.toggle('disabled', disabledAll || !!board[i]);
      cell.classList.toggle('win-cell', !!(winLine && winLine.includes(i)));
      const existing = cell.querySelector('.mark');
      if(board[i]){
        if(!existing || existing.dataset.val !== board[i]){
          cell.innerHTML = '';
          const span = document.createElement('span');
          span.className = 'mark ' + (board[i] === 'X' ? 'x' : 'o');
          span.dataset.val = board[i];
          span.textContent = board[i];
          cell.appendChild(span);
        }
      } else {
        cell.innerHTML = '';
      }
    }
  }

  // ================= SCREEN SWITCHING =================
  const screens = {
    lobby: document.getElementById('lobbyScreen'),
    ai: document.getElementById('aiScreen'),
    onlineSetup: document.getElementById('onlineSetupScreen'),
    onlineGame: document.getElementById('onlineGameScreen')
  };
  function showScreen(name){
    Object.keys(screens).forEach(k => screens[k].classList.toggle('hidden', k !== name));
  }

  document.getElementById('toAiBtn').addEventListener('click', () => {
    showScreen('ai');
    AI.init();
  });
  document.getElementById('toOnlineBtn').addEventListener('click', () => {
    showScreen('onlineSetup');
  });
  document.getElementById('aiBackBtn').addEventListener('click', () => showScreen('lobby'));
  document.getElementById('onlineSetupBackBtn').addEventListener('click', () => {
    Online.cleanup();
    showScreen('lobby');
  });
  document.getElementById('onlineGameBackBtn').addEventListener('click', () => {
    Online.cleanup();
    showScreen('lobby');
  });

  // ================= AI LADDER MODE =================
  const AI = (function(){
    const LEVELS = [
      { name: '新手幽靈',   desc: '剛甦醒的幽靈，偶爾會失神，但不會讓你輕易得手。' },
      { name: '見習棋士',   desc: '穩紮穩打，會擋也會抓機會，鮮少露出破綻。' },
      { name: '老練棋手',   desc: '懂得布局，會主動製造雙重威脅逼你顧此失彼。' },
      { name: '棋靈',       desc: '棋盤上的老靈魂，看得穿好幾步之後的局面。' },
      { name: '太古棋魂',   desc: '算得很深的最終考驗，但依然會露出破綻。' }
    ];
    const MISTAKE_RATES = [0.30, 0.20, 0.12, 0.07, 0.09];

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restart');
    const resetProgressBtn = document.getElementById('resetProgress');
    const levelRowEl = document.getElementById('levelRow');
    const progressTrackEl = document.getElementById('progressTrack');
    const levelNameEl = document.getElementById('levelName');
    const levelDescEl = document.getElementById('levelDesc');

    let board, queues, gameOver, humanTurn;
    let currentLevelIndex = 0;
    let unlockedCount = 1;
    let clearedSet = new Set();
    let built = false;

    function init(){
      board = Array(9).fill(null);
      queues = { X: [], O: [] };
      gameOver = false;
      humanTurn = true;
      if(!built){ buildCellsInto(boardEl, handleCellClick); built = true; }
      renderLevels();
      updateLevelInfo();
      render();
      setStatus('輪到你了，請下 X');
    }

    function renderLevels(){
      levelRowEl.innerHTML = '';
      progressTrackEl.innerHTML = '';
      LEVELS.forEach((lvl, i) => {
        const btn = document.createElement('button');
        btn.className = 'level-btn';
        btn.type = 'button';
        btn.textContent = (i + 1);
        const locked = i >= unlockedCount;
        if(locked) btn.classList.add('locked');
        if(i === currentLevelIndex) btn.classList.add('active');
        if(clearedSet.has(i)) btn.classList.add('cleared');
        btn.setAttribute('aria-label', lvl.name + (locked ? '（尚未解鎖）' : ''));
        btn.disabled = locked;
        btn.addEventListener('click', () => {
          if(locked || i === currentLevelIndex) return;
          currentLevelIndex = i;
          init();
        });
        levelRowEl.appendChild(btn);

        const step = document.createElement('div');
        step.className = 'step';
        if(clearedSet.has(i)) step.classList.add('cleared');
        if(i === currentLevelIndex) step.classList.add('current');
        progressTrackEl.appendChild(step);
      });
    }

    function updateLevelInfo(){
      const lvl = LEVELS[currentLevelIndex];
      levelNameEl.textContent = `第 ${currentLevelIndex + 1} / ${LEVELS.length} 關　${lvl.name}`;
      levelDescEl.textContent = lvl.desc;
    }

    function setStatus(text){ statusEl.textContent = text; }

    function render(winLine){
      renderBoardInto(boardEl, board, gameOver || !humanTurn, winLine);
    }

    function doMove(idx, player){
      const result = place(board, queues, idx, player);
      board = result.board;
      queues = result.queues;

      if(wins(board, player)){
        gameOver = true;
        render(findWinLine(board, player));

        if(player === 'X'){
          clearedSet.add(currentLevelIndex);
          let justUnlocked = null;
          if(currentLevelIndex === unlockedCount - 1 && unlockedCount < LEVELS.length){
            unlockedCount++;
            justUnlocked = LEVELS[unlockedCount - 1].name;
          }
          renderLevels();
          if(justUnlocked){
            setStatus(`你打敗了${LEVELS[currentLevelIndex].name}！解鎖『${justUnlocked}』`);
          } else if(currentLevelIndex === LEVELS.length - 1){
            setStatus(`你征服了${LEVELS[currentLevelIndex].name}！`);
          } else {
            setStatus(`你打敗了${LEVELS[currentLevelIndex].name}！`);
          }
        } else {
          setStatus(`${LEVELS[currentLevelIndex].name}贏了，再挑戰一次？`);
        }
        return true;
      }
      render();
      return false;
    }

    function handleCellClick(idx){
      if(gameOver || !humanTurn || board[idx]) return;
      const finished = doMove(idx, 'X');
      if(!finished){
        humanTurn = false;
        setStatus(`${LEVELS[currentLevelIndex].name}思考中…`);
        render();
        setTimeout(aiTurn, 500);
      }
    }

    function aiTurn(){
      if(gameOver) return;
      const idx = getAIMove(board, queues);
      const finished = doMove(idx, 'O');
      if(!finished){
        humanTurn = true;
        setStatus('輪到你了');
        render();
      }
    }

    function getAIMove(b, qs){
      const empties = emptyCells(b);
      if(Math.random() < MISTAKE_RATES[currentLevelIndex]){
        return empties[Math.floor(Math.random() * empties.length)];
      }
      switch(currentLevelIndex){
        case 0: return level1Move(b, qs, empties);
        case 1: return level2Move(b, qs, empties);
        case 2: return level3Move(b, qs, empties);
        case 3: return minimaxMove(b, qs, empties, 5);
        default: return minimaxMove(b, qs, empties, 6);
      }
    }

    function winningMove(b, qs, empties, player){
      for(const c of empties){
        const { board: b2 } = place(b, qs, c, player);
        if(wins(b2, player)) return c;
      }
      return null;
    }

    function safeMoves(b, qs, empties){
      const safe = [];
      for(const c of empties){
        const { board: b2, queues: qs2 } = place(b, qs, c, 'O');
        let dangerous = false;
        for(const c2 of emptyCells(b2)){
          const { board: b3 } = place(b2, qs2, c2, 'X');
          if(wins(b3, 'X')){ dangerous = true; break; }
        }
        if(!dangerous) safe.push(c);
      }
      return safe;
    }

    function pickByPreference(pool){
      const preference = [4,0,2,6,8,1,3,5,7];
      for(const p of preference) if(pool.includes(p)) return p;
      return pool[0];
    }

    function level1Move(b, qs, empties){
      const win = winningMove(b, qs, empties, 'O');
      if(win !== null) return win;
      const block = winningMove(b, qs, empties, 'X');
      if(block !== null) return block;
      return empties[Math.floor(Math.random() * empties.length)];
    }

    function level2Move(b, qs, empties){
      const win = winningMove(b, qs, empties, 'O');
      if(win !== null) return win;
      const block = winningMove(b, qs, empties, 'X');
      if(block !== null) return block;
      const safe = safeMoves(b, qs, empties);
      return pickByPreference(safe.length ? safe : empties);
    }

    function level3Move(b, qs, empties){
      const win = winningMove(b, qs, empties, 'O');
      if(win !== null) return win;
      const block = winningMove(b, qs, empties, 'X');
      if(block !== null) return block;

      const safe = safeMoves(b, qs, empties);
      const pool = safe.length ? safe : empties;

      let bestFork = null;
      let bestThreats = 1;
      for(const c of pool){
        const { board: b2 } = place(b, qs, c, 'O');
        let threats = 0;
        for(const line of LINES){
          const vals = line.map(i => b2[i]);
          if(vals.filter(v => v === 'O').length === 2 && vals.filter(v => v === 'X').length === 0){
            threats++;
          }
        }
        if(threats > bestThreats){
          bestThreats = threats;
          bestFork = c;
        }
      }
      return bestFork !== null ? bestFork : pickByPreference(pool);
    }

    function evaluateHeuristic(b){
      let score = 0;
      for(const line of LINES){
        const vals = line.map(i => b[i]);
        const oCount = vals.filter(v => v === 'O').length;
        const xCount = vals.filter(v => v === 'X').length;
        if(oCount > 0 && xCount > 0) continue;
        if(oCount === 2) score += 5;
        else if(oCount === 1) score += 1;
        if(xCount === 2) score -= 5;
        else if(xCount === 1) score -= 1;
      }
      if(b[4] === 'O') score += 2;
      else if(b[4] === 'X') score -= 2;
      return score;
    }

    function minimax(b, qs, isAITurn, depth){
      if(wins(b, 'O')) return 1000 + depth;
      if(wins(b, 'X')) return -1000 - depth;
      if(depth === 0) return evaluateHeuristic(b);
      const empties = emptyCells(b);
      if(isAITurn){
        let best = -Infinity;
        for(const c of empties){
          const { board: b2, queues: q2 } = place(b, qs, c, 'O');
          best = Math.max(best, minimax(b2, q2, false, depth - 1));
        }
        return best;
      } else {
        let best = Infinity;
        for(const c of empties){
          const { board: b2, queues: q2 } = place(b, qs, c, 'X');
          best = Math.min(best, minimax(b2, q2, true, depth - 1));
        }
        return best;
      }
    }

    function minimaxMove(b, qs, empties, depth){
      let bestVal = -Infinity;
      let bestMoves = [];
      for(const c of empties){
        const { board: b2, queues: q2 } = place(b, qs, c, 'O');
        const val = wins(b2, 'O') ? Infinity : minimax(b2, q2, false, depth);
        if(val > bestVal){
          bestVal = val;
          bestMoves = [c];
        } else if(val === bestVal){
          bestMoves.push(c);
        }
      }
      return pickByPreference(bestMoves);
    }

    restartBtn.addEventListener('click', init);
    resetProgressBtn.addEventListener('click', () => {
      currentLevelIndex = 0;
      unlockedCount = 1;
      clearedSet = new Set();
      init();
    });

    return { init };
  })();

  // ================= ONLINE (REMOTE P2P) MODE =================
  const Online = (function(){
    const hostTabBtn = document.getElementById('hostTabBtn');
    const joinTabBtn = document.getElementById('joinTabBtn');
    const hostPane = document.getElementById('hostPane');
    const joinPane = document.getElementById('joinPane');
    const hostCreateBtn = document.getElementById('hostCreateBtn');
    const roomCodeDisplay = document.getElementById('roomCodeDisplay');
    const hostStatusLine = document.getElementById('hostStatusLine');
    const copyCodeBtn = document.getElementById('copyCodeBtn');
    const joinCodeInput = document.getElementById('joinCodeInput');
    const joinConnectBtn = document.getElementById('joinConnectBtn');
    const joinStatusLine = document.getElementById('joinStatusLine');

    const onlineBoardEl = document.getElementById('onlineBoard');
    const onlineStatusEl = document.getElementById('onlineStatus');
    const myMarkBadge = document.getElementById('myMarkBadge');
    const rematchBtn = document.getElementById('rematchBtn');

    const ID_PREFIX = 'vttt-';
    const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

    let peer = null;
    let conn = null;
    let roomCode = '';
    let myMark = 'X';
    let board, queues, gameOver, turn;
    let connected = false;
    let built = false;

    function genCode(){
      let s = '';
      for(let i=0;i<4;i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
      return s;
    }

    hostTabBtn.addEventListener('click', () => switchTab('host'));
    joinTabBtn.addEventListener('click', () => switchTab('join'));
    function switchTab(which){
      hostTabBtn.classList.toggle('active', which === 'host');
      joinTabBtn.classList.toggle('active', which === 'join');
      hostPane.classList.toggle('active', which === 'host');
      joinPane.classList.toggle('active', which === 'join');
    }

    hostCreateBtn.addEventListener('click', hostRoom);
    joinConnectBtn.addEventListener('click', () => joinRoom(joinCodeInput.value));
    joinCodeInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') joinRoom(joinCodeInput.value); });
    copyCodeBtn.addEventListener('click', () => {
      if(!roomCode) return;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(roomCode).then(() => {
          copyCodeBtn.textContent = '已複製！';
          setTimeout(() => { copyCodeBtn.textContent = '複製房號'; }, 1500);
        }).catch(() => {});
      }
    });
    rematchBtn.addEventListener('click', () => doRematch(true));

    function hostRoom(){
      cleanup();
      hostCreateBtn.disabled = true;
      hostStatusLine.textContent = '建立房間中…';
      const code = genCode();
      peer = new Peer(ID_PREFIX + code);

      peer.on('open', () => {
        roomCode = code;
        roomCodeDisplay.textContent = code;
        roomCodeDisplay.classList.remove('hidden');
        copyCodeBtn.classList.remove('hidden');
        hostStatusLine.textContent = '等待對手加入…';
      });

      peer.on('connection', (c) => {
        conn = c;
        setupConnHandlers();
        conn.on('open', () => startMatch('X'));
      });

      peer.on('error', (err) => {
        hostCreateBtn.disabled = false;
        hostStatusLine.textContent = friendlyError(err);
      });
    }

    function joinRoom(codeRaw){
      const code = (codeRaw || '').trim().toUpperCase();
      if(code.length !== 4){
        joinStatusLine.textContent = '請輸入 4 碼房號';
        return;
      }
      cleanup();
      joinConnectBtn.disabled = true;
      joinStatusLine.textContent = '連線中…';
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(ID_PREFIX + code, { reliable: true });
        setupConnHandlers();
        conn.on('open', () => startMatch('O'));
      });

      peer.on('error', (err) => {
        joinConnectBtn.disabled = false;
        joinStatusLine.textContent = friendlyError(err);
      });
    }

    function friendlyError(err){
      if(err && err.type === 'peer-unavailable') return '找不到這個房間，請確認房號是否正確';
      if(err && err.type === 'network') return '網路連線異常，請檢查網路後再試';
      return '連線發生錯誤，請重試';
    }

    function setupConnHandlers(){
      conn.on('data', (data) => {
        if(!data) return;
        if(data.type === 'move') receiveMove(data.index);
        else if(data.type === 'rematch') doRematch(false);
      });
      conn.on('close', onOpponentLeft);
      conn.on('error', onOpponentLeft);
    }

    function onOpponentLeft(){
      if(!connected) return;
      connected = false;
      setOnlineStatus('對手已離線');
      rematchBtn.classList.add('hidden');
      renderOnlineBoard();
    }

    function startMatch(mark){
      myMark = mark;
      connected = true;
      board = Array(9).fill(null);
      queues = { X: [], O: [] };
      gameOver = false;
      turn = 'X';
      myMarkBadge.textContent = '你是 ' + myMark;
      if(!built){ buildCellsInto(onlineBoardEl, handleCellClick); built = true; }
      rematchBtn.classList.add('hidden');
      renderOnlineBoard();
      setOnlineStatus(isMyTurn() ? '輪到你了' : '等待對手下子…');
      hostCreateBtn.disabled = false;
      joinConnectBtn.disabled = false;
      showScreen('onlineGame');
    }

    function isMyTurn(){ return connected && !gameOver && turn === myMark; }

    function setOnlineStatus(text){ onlineStatusEl.textContent = text; }

    function renderOnlineBoard(winLine){
      renderBoardInto(onlineBoardEl, board, !isMyTurn(), winLine);
    }

    function doMove(idx, player){
      const result = place(board, queues, idx, player);
      board = result.board;
      queues = result.queues;

      if(wins(board, player)){
        gameOver = true;
        renderOnlineBoard(findWinLine(board, player));
        const youWon = player === myMark;
        setOnlineStatus(youWon ? '你贏了！🎉' : '你輸了，再試一次？');
        rematchBtn.classList.remove('hidden');
        return true;
      }
      renderOnlineBoard();
      return false;
    }

    function handleCellClick(idx){
      if(!isMyTurn() || board[idx]) return;
      const finished = doMove(idx, myMark);
      if(conn && conn.open) conn.send({ type: 'move', index: idx });
      if(!finished){
        turn = (myMark === 'X') ? 'O' : 'X';
        setOnlineStatus('等待對手下子…');
        renderOnlineBoard();
      }
    }

    function receiveMove(idx){
      if(gameOver) return;
      const opponentMark = myMark === 'X' ? 'O' : 'X';
      const finished = doMove(idx, opponentMark);
      if(!finished){
        turn = myMark;
        setOnlineStatus('輪到你了');
        renderOnlineBoard();
      }
    }

    function doRematch(initiatedLocally){
      if(!gameOver) return;
      board = Array(9).fill(null);
      queues = { X: [], O: [] };
      gameOver = false;
      turn = 'X';
      rematchBtn.classList.add('hidden');
      renderOnlineBoard();
      setOnlineStatus(isMyTurn() ? '輪到你了（新的一局）' : '等待對手（新的一局）');
      if(initiatedLocally && conn && conn.open) conn.send({ type: 'rematch' });
    }

    function cleanup(){
      if(conn){ try{ conn.close(); }catch(e){} conn = null; }
      if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
      connected = false;
      roomCode = '';
      roomCodeDisplay.classList.add('hidden');
      roomCodeDisplay.textContent = '';
      copyCodeBtn.classList.add('hidden');
      copyCodeBtn.textContent = '複製房號';
      hostStatusLine.textContent = '';
      joinStatusLine.textContent = '';
      joinCodeInput.value = '';
      hostCreateBtn.disabled = false;
      joinConnectBtn.disabled = false;
      switchTab('host');
    }

    return { cleanup };
  })();

})();
</script>
